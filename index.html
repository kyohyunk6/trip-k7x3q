<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>영신여자고등학교 제주 교육여행 안내</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;800&display=swap">
<style>
*{box-sizing:border-box}
body{background:#F6F7FB;color:#1F2338;font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;word-break:keep-all}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px;display:flex;flex-direction:column;gap:18px}
.school{margin:0;font-size:16px;font-weight:700;color:#5C6278}
h1{margin:0;font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;font-size:30px;line-height:1.2}
.date{margin:0;font-size:15px;font-weight:700;color:#5C6278}
.team{display:flex;flex-direction:column;gap:12px;color:#fff;text-decoration:none;border-radius:22px;padding:18px 18px 16px;box-shadow:0 8px 20px var(--sh);background:var(--c);animation:thump var(--beat,1.2s) ease-in-out infinite}
.team:focus-visible{outline:3px solid #1F2338;outline-offset:3px}
.A{--c:#D93A65;--sh:rgba(217,58,101,.3)} .B{--c:#2F6FD8;--sh:rgba(47,111,216,.3)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font-family:'Jua','Noto Sans KR',sans-serif;font-size:28px}
.name small{font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:700;margin-left:6px;opacity:.92}
.meet{font-size:15px;font-weight:700;opacity:.95}
.meet b{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;font-size:24px;margin-left:4px}
.k{margin:0;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800}
.heart{width:24px;height:24px;flex-shrink:0;animation:thump-big var(--beat,1.2s) ease-in-out infinite}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.n{background:rgba(255,255,255,.18);border-radius:14px;padding:10px 4px 8px;text-align:center}
.n b{display:block;font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.n b.pop{animation:pop .35s ease-out}
.n span{font-size:13px;font-weight:800;opacity:.92}
.go{margin:0;font-size:16px;font-weight:800;text-align:right}
.done{margin:0;font-size:20px;font-weight:800}
.foot{margin:0;font-size:13px;font-weight:700;color:#5C6278}
@keyframes thump{0%,45%,100%{transform:scale(1)}10%{transform:scale(1.03)}20%{transform:scale(1)}30%{transform:scale(1.018)}}
@keyframes thump-big{0%,45%,100%{transform:scale(1)}10%{transform:scale(1.3)}20%{transform:scale(1)}30%{transform:scale(1.18)}}
@keyframes pop{0%{transform:scale(1.35)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.team,.heart,.n b.pop{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<p class="school">영신여자고등학교</p>
<h1>1학년 제주 교육여행 안내</h1>
<p class="date">2026. 10. 26.(월) ~ 10. 28.(수)</p>
<a class="team A" href="a.html" data-at="2026-10-26T05:10:00+09:00">
  <div class="top"><span class="name">A팀<small>1·6·7·8반</small></span><span class="meet">집결<b>05:10</b></span></div>
  <p class="k"><svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.5h2c.7-1.3 2.2-2.5 4.3-2.5 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" fill="#fff"/></svg>집결까지 남은 시간</p>
  <div class="nums"><div class="n"><b data-u="d">-</b><span>일</span></div><div class="n"><b data-u="h">-</b><span>시간</span></div><div class="n"><b data-u="m">-</b><span>분</span></div><div class="n"><b data-u="s">-</b><span>초</span></div></div>
  <p class="done" hidden>집결 시간이 되었습니다.</p>
  <p class="go">A팀 안내 보기 →</p>
</a>
<a class="team B" href="b.html" data-at="2026-10-26T06:20:00+09:00">
  <div class="top"><span class="name">B팀<small>2·3·4·5·9반</small></span><span class="meet">집결<b>06:20</b></span></div>
  <p class="k"><svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.5h2c.7-1.3 2.2-2.5 4.3-2.5 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" fill="#fff"/></svg>집결까지 남은 시간</p>
  <div class="nums"><div class="n"><b data-u="d">-</b><span>일</span></div><div class="n"><b data-u="h">-</b><span>시간</span></div><div class="n"><b data-u="m">-</b><span>분</span></div><div class="n"><b data-u="s">-</b><span>초</span></div></div>
  <p class="done" hidden>집결 시간이 되었습니다.</p>
  <p class="go">B팀 안내 보기 →</p>
</a>
<p class="foot">영신여자고등학교 1학년부</p>
</div>
<script>
(function(){
  var cards=[].slice.call(document.querySelectorAll('.team'));
  function p(n){return n<10?'0'+n:''+n}
  function tick(){
    var alive=false;
    cards.forEach(function(c){
      var left=Math.floor((new Date(c.getAttribute('data-at')).getTime()-Date.now())/1000);
      if(left<=0){c.querySelector('.nums').hidden=true;c.querySelector('.done').hidden=false;return}
      alive=true;
      c.querySelector('[data-u=d]').textContent=Math.floor(left/86400);
      c.querySelector('[data-u=h]').textContent=p(Math.floor(left%86400/3600));
      c.querySelector('[data-u=m]').textContent=p(Math.floor(left%3600/60));
      var se=c.querySelector('[data-u=s]');se.textContent=p(left%60);se.classList.remove('pop');void se.offsetWidth;se.classList.add('pop');
      c.style.setProperty('--beat',left<3600?'0.6s':(left<86400?'0.85s':'1.2s'));
    });
    return alive}
  if(tick()){var t=setInterval(function(){if(!tick())clearInterval(t)},1000)}
})();
</script>
<script data-goatcounter="https://kyohyunk6.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
